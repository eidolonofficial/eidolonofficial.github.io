<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" role="img" aria-labelledby="title desc">
  <title id="title">Eidolon lantern</title>
  <desc id="desc">A line drawing of a lantern with a lit flame, in gilt by day and candle gold by night.</desc>
  <style>
    .line { fill: none; stroke: #A06D14; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .glass { fill: #F2B65A; fill-opacity: 0.28; }
    .flame { fill: #F2B65A; }
    .core { fill: #FFF3CF; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #F1C46A; }
      .glass { fill: #F5B95C; fill-opacity: 0.32; }
      .flame { fill: #F5B95C; }
    }
  </style>
  <path class="glass" d="M64 104h72l-6 108H70z"/>
  <g class="line">
    <path d="M70 62c0-21 13-29 30-29s30 8 30 29"/>
    <path d="M60 66h80l14 22H46z"/>
    <path d="M52 92h96l-8 132H60z"/>
    <path d="M54 228h92l-12 20H66z"/>
    <path d="M70 276h60"/>
  </g>
  <path class="flame" d="M100 120c16 24 26 38 26 56 0 17-11 28-26 28s-26-11-26-28c0-18 10-32 26-56z"/>
  <path class="core" d="M100 156c7 11 11 19 11 27 0 8-5 13-11 13s-11-5-11-13c0-8 4-16 11-27z"/>
</svg>
